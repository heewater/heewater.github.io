<html lang="ko">

<meta property="og:type" content="website">
<meta property="og:title" content="조희수 포트폴리오">
<meta property="og:description" content="과정을 이해하고, 좋은 결과를 만들어 가는 디자이너 조희수입니다.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: editorial index. One large English statement, then the work as a numbered index of big images on hairline rules, then the person; white paper, black type, one blue */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --well: #f1f2f4;          /* image wells and quiet panels */
  --ink: #0e1013;
  --muted: #6a707b;
  --line: #e3e5e9;
  --accent: #1d4ed8;        /* the one blue: links, the italic phrase, active nav */
  --accent-soft: #e8eefc;
  --glow: rgba(59, 110, 246, .24);
  --glow-2: rgba(120, 170, 255, .2);
  --chip-ink: #ffffff;
  --shadow: none;
  --shadow-hover: none;
  --sheet-shadow: 0 1px 2px rgba(14, 16, 19, .04), 0 10px 36px rgba(14, 16, 19, .07);   /* detail page lifted off the viewer's well */
  --draft-ink: #9a4a00;
  --draft-bg: #fff0d4;
  --font-display: "Inter", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: var(--font-display);   /* small labels use the display face, so the page runs on two families */
  --radius: 6px;
  --wrap: 1240px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e10; --surface: #0d0e10; --well: #18191c; --ink: #eceef1; --muted: #8d939d; --line: #26282d;
    --accent: #7ea2ff; --accent-soft: #18213a; --chip-ink: #0d0e10; color-scheme: dark;
    --glow: rgba(70, 110, 255, .18); --glow-2: rgba(70, 140, 255, .08);
    --draft-ink: #ffc56e; --draft-bg: #3a2a12;
    --sheet-shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 14px 44px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e10; --surface: #0d0e10; --well: #18191c; --ink: #eceef1; --muted: #8d939d; --line: #26282d;
  --accent: #7ea2ff; --accent-soft: #18213a; --chip-ink: #0d0e10; color-scheme: dark;
  --glow: rgba(70, 110, 255, .18); --glow-2: rgba(70, 140, 255, .08);
  --draft-ink: #ffc56e; --draft-bg: #3a2a12;
  --sheet-shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 14px 44px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  word-break: keep-all; -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
p, li, dd, small { text-wrap: pretty; overflow-wrap: break-word; }

.wrap {
  max-width: var(--wrap); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  padding-block: 14px;
}
.top-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 10px 8px 18px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; white-space: nowrap; }
.brand-mark { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav a {
  text-decoration: none; font-size: 14px; padding: 7px 12px; border-radius: 999px; white-space: nowrap; color: var(--muted);
}
/* hover tint only where a real pointer hovers: on a phone a tapped menu item would keep it after scrolling away */
@media (hover: hover) { .nav a:hover { color: var(--ink); background: var(--bg); } }
.top { transition: opacity .3s ease, transform .3s ease; }

/* side nav: replaces the top bar on wide screens once the hero has scrolled away */
.side-nav {
  position: fixed; z-index: 10; top: 50%;
  right: max(28px, calc(env(safe-area-inset-right, 0px) + 16px));
  display: none; flex-direction: column; align-items: flex-end; gap: 4px;
  opacity: 0; pointer-events: none; transform: translate(12px, -50%);
  transition: opacity .3s ease, transform .3s ease;
}
.side-nav a {
  display: flex; align-items: center; gap: 10px; text-decoration: none;
  font-size: 13px; font-weight: 500; letter-spacing: .04em; color: var(--muted); padding: 6px 0;
}
.side-nav a::after { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--line); transition: width .25s ease, background .25s ease; }
.side-nav a:hover { color: var(--ink); }
.side-nav a.active { color: var(--accent); }
.side-nav a.active::after { width: 28px; background: var(--accent); }
@media (min-width: 1400px) {
  .side-nav { display: flex; }
  body.scrolled .side-nav { opacity: 1; pointer-events: auto; transform: translate(0, -50%); }
  body.scrolled .top { opacity: 0; pointer-events: none; transform: translateY(-12px); }
}
@media (prefers-reduced-motion: reduce) { .top, .side-nav { transition: none; } }

.field-tabs { margin-bottom: 8px; }

/* hero */
.hero { padding-block: 24px 0; }
/* bento hero: statement, person, numbers, tools and scope as tiles of different weight */
.bento {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;
  padding-top: clamp(24px, 4vw, 48px);
}
.tile { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px, 2vw, 26px); min-width: 0; }
/* main tile: statement, name and career on the left, photo filling the right edge */
.t-main { grid-column: 1 / 5; display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 28%, 320px); padding: 0; overflow: hidden; }
.t-main-text { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: clamp(26px, 3.4vw, 44px); }
.t-main-photo { position: relative; min-height: 280px; background: #e9eaec; }
.t-main-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 8px; }
.hero-meta .who { display: flex; align-items: baseline; gap: 8px; }
.hero-meta .who b { font-size: 17px; font-weight: 700; }
.career-pill { display: inline-flex; align-items: baseline; gap: 10px; padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--chip-ink); }
.career-pill b { font-size: 17px; font-weight: 800; white-space: nowrap; }
@media (max-width: 480px) { .career-pill { flex-wrap: wrap; gap: 2px 10px; border-radius: 16px; } }
.career-pill b small { font-size: .7em; font-weight: 700; margin-left: 1px; }
.career-pill span { font-size: 13px; opacity: .9; }
.hero-role { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--muted); }
.hero-title { font-size: clamp(28px, 3.4vw, 42px); font-weight: 800; line-height: 1.2; letter-spacing: -.02em; }
.hero-title strong { color: var(--accent); font-weight: 800; }
.hero-sub { font-size: 15px; color: var(--muted); }
.t-stat { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.t-stat b { font-size: clamp(24px, 2.4vw, 30px); font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.t-stat b small { font-size: .5em; font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.t-stat span { font-size: 13px; color: var(--muted); }
.t-blue { background: var(--accent); color: var(--chip-ink); }
.t-blue span { color: inherit; opacity: .85; }
.t-tools { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 6px; }
/* sticker look borrowed from the detail-page work: white rim, slight tilt */
.tool-sticker {
  font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 3px var(--surface), 0 4px 10px -4px rgba(20, 120, 240, .35);
}
.tool-sticker:nth-child(odd) { transform: rotate(-4deg); }
.tool-sticker:nth-child(even) { transform: rotate(3deg); }
.t-scope { grid-column: 3 / 5; display: flex; flex-wrap: wrap; align-content: center; align-items: center; gap: 12px 22px; }
.scope { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
/* the POINT toggle from the detail page, switched on */
.switch { width: 32px; height: 20px; border-radius: 999px; background: var(--accent); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.scope-note { flex-basis: 100%; font-size: 13px; color: var(--muted); }
@media (max-width: 820px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .t-main { grid-column: 1 / 3; grid-template-columns: minmax(0, 1fr); }
  .t-main-photo { order: -1; min-height: 0; aspect-ratio: 4 / 3; }
  .t-scope { grid-column: 1 / 3; }
  .scope-note { margin-left: 0; }
}
.hero-body { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.who { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.avatar {
  width: 180px; height: 180px; max-width: 100%; flex: none;
  border-radius: 50%; object-fit: cover; box-shadow: var(--shadow);
}
.who h1 { font-size: clamp(26px, 3.2vw, 32px); font-weight: 700; letter-spacing: -.01em; }
.who .en { font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.lead { font-size: 18px; line-height: 1.65; }
.lead strong { color: var(--accent); font-weight: 600; }
.contact-list { display: grid; gap: 8px; }
.contact-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.contact-row .k { width: 56px; flex: none; }
.contact-row .v { font-family: var(--font-mono); font-size: 15px; user-select: all; }
.copy {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  font-size: 12px; padding: 3px 10px; cursor: pointer; color: var(--muted);
}
.copy:hover { color: var(--ink); border-color: var(--muted); }

/* about */
.section { padding-block: 64px 0; scroll-margin-top: 70px; }
.hero { scroll-margin-top: 90px; }
.section-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.section-head h2 { font-size: clamp(24px, 3vw, 30px); font-weight: 700; }
.section-head p { color: var(--muted); }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -8px; }
.facts span { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-weight: 500; }
.intro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
.about-lead { font-size: 18px; line-height: 1.6; margin: -4px 0 28px; }
.intro-list { padding-block: 28px; }
.intro { display: grid; gap: 8px; padding-block: 28px; border-top: 1px solid var(--line); }
.intro:first-child { border-top: 0; padding-top: 0; }
.intro:last-child { padding-bottom: 0; }
.intro h3 { font-size: 18px; font-weight: 700; line-height: 1.5; color: var(--accent); }
.intro p { font-size: 15px; line-height: 1.8; color: var(--muted); }

/* scroll reveal: only sections that start below the fold get the pre-state */
.reveal { opacity: 0; transform: translateY(40px); transition: opacity .7s ease, transform .8s cubic-bezier(.2, .7, .2, 1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
.job-summary { margin-top: 12px; font-weight: 600; font-size: 15px; }
.section-head .total { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--accent); margin-left: 8px; letter-spacing: .02em; }
.career { display: grid; gap: 12px; }
.job { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 8px 28px; }
.job-when time { display: block; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.job-when small { color: var(--muted); font-size: 13px; }
.job-when .now { color: var(--accent); font-weight: 600; }
.job h3 { font-size: 20px; font-weight: 700; }
.job-role { color: var(--muted); font-size: 15px; margin-top: 2px; }
.tasks { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tasks li { font-size: 15px; color: var(--muted); padding-left: 14px; position: relative; }
.tasks li::before { content: ""; position: absolute; left: 0; top: .78em; width: 6px; height: 2px; background: var(--accent); }
.job-link { margin-top: 14px; font-size: 13px; }
@media (max-width: 640px) { .job { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; min-width: 0; }
.panel .eyebrow { margin-bottom: 16px; display: block; }
.timeline li.edu { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.timeline li.edu time { color: var(--muted); font-size: 13px; padding: 0; }
.skills { display: grid; gap: 18px; }
.skill { display: grid; gap: 8px; }
.skill-label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.skill .fields { margin: 0; gap: 6px; }
.skill .chip { border-color: transparent; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.skill:first-child .chip { background: var(--accent); color: var(--chip-ink); }
.timeline { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.timeline li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; font-size: 15px; }
.timeline time { font-family: var(--font-mono); font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 1px; }
.timeline small { display: block; color: var(--muted); font-size: 13px; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; background: var(--surface);
}
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
a.chip:hover { border-color: var(--accent); color: var(--accent); }

/* work */
.field { padding-top: 40px; scroll-margin-top: 90px; }
.field-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.field-head h3 { font-size: 22px; font-weight: 700; }
.field-head .eyebrow { color: var(--accent); }
.field-head p { color: var(--muted); font-size: 15px; flex-basis: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px -18px rgba(20, 40, 80, .35); border-color: var(--accent); }
.card-img { aspect-ratio: 2251 / 1428; max-width: 100%; overflow: hidden; background: var(--bg); }
.card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card:hover .card-img img { transform: scale(1.03); }
.card-body { padding: 18px 20px 20px; display: grid; gap: 4px; }
.card-body h4 { margin: 0; font-size: 18px; font-weight: 700; }
.card-body p { color: var(--muted); font-size: 14px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; }
.card-foot .more { color: var(--accent); font-weight: 600; }
.tools { display: flex; gap: 4px; }
.tool {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; min-width: 26px; text-align: center;
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted);
}

/* detail */
.detail { padding-block: 24px 0; }
.back {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px 7px 12px;
}
.back:hover { border-color: var(--accent); color: var(--accent); }
.detail-head {
  margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: clamp(24px, 4vw, 44px);
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px 48px;
}
.detail-head h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; margin-top: 8px; }
.detail-head .sub { font-size: 17px; font-weight: 600; margin-top: 4px; }
.detail-head .desc { margin-top: 18px; color: var(--muted); max-width: 60ch; display: grid; gap: 10px; }
.meta { display: grid; gap: 0; align-content: start; margin: 0; }
.meta div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); font-size: 15px; }
.meta div:first-child { border-top: 0; padding-top: 0; }
.meta dt { font-weight: 600; }
.meta dd { margin: 0; color: var(--muted); }
.kw { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 24px; }
.kw-groups { display: grid; gap: 22px; }
.kw-group h5 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.kw-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.kw-item { background: var(--bg); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--muted); }
.kw-item b { display: block; color: var(--accent); font-size: 15px; margin-bottom: 2px; }
.pages { display: grid; gap: 18px; margin-top: 18px; }
.pages figure { margin: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--surface); aspect-ratio: 2251 / 1428; max-width: 100%; }
.pages img { width: 100%; height: 100%; object-fit: cover; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
.pager a {
  text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 22px; display: grid; gap: 2px; min-width: 0;
}
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; }
.pager strong { font-size: 17px; }

/* footer */
.foot { padding-block: 64px 40px; scroll-margin-top: 90px; }
.foot-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px;
  border-top: 1px solid var(--line); padding-top: 28px;
}
.foot-name { font-weight: 700; font-size: 17px; }
.foot-contact { display: flex; flex-wrap: wrap; gap: 10px 28px; }

/* below the hero: type one step smaller, panels a little roomier */
.section-head h2 { font-size: clamp(22px, 2.6vw, 27px); }
.section-head p, .field-head p { font-size: 14px; }
.about-lead { font-size: 17px; }
.intro h3 { font-size: 17px; }
.intro p, .tasks li, .job-role, .job-summary, .timeline li { font-size: 14px; }
.job h3 { font-size: 18px; }
.job-when time, .timeline time { font-size: 13px; }
.timeline small, .job-when small, .skill-label { font-size: 12px; }
.skill .chip, .field-tabs .chip, .job-link { font-size: 13px; }
.field-head h3 { font-size: 20px; }

/* case-study sections (draft structure) */
.draft {
  display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .02em;
  color: var(--draft-ink); background: var(--draft-bg); border-radius: 999px; padding: 2px 9px; vertical-align: middle;
}

.sec-img { margin: 0; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 2251 / 1428; max-width: 100%; }
.sec-img img { width: 100%; height: 100%; object-fit: cover; }
.slot {
  max-width: 100%; border-radius: var(--radius); border: 2px dashed color-mix(in srgb, var(--draft-ink) 45%, transparent);
  background: repeating-linear-gradient(135deg, var(--surface) 0 14px, var(--bg) 14px 28px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 24px;
}
.slot strong { font-size: 18px; }
.slot p { color: var(--muted); font-size: 14px; max-width: 40ch; }
.slot small { color: var(--muted); font-size: 12px; }
.annot { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px 40px; align-items: center; }
.annot-fig { background: #f1f2f4; border-radius: 14px; padding: 76px 40px 48px; }
/* the logo sits narrower than the box so the pins that point outward stay inside it */
.annot-img { position: relative; width: 84%; margin-inline: auto; }

.pin {
  position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--chip-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center;
  box-shadow: 0 0 0 3px #f1f2f4;
}

.annot-list { margin: 0; padding: 0; list-style: none; counter-reset: pin; display: grid; }
.annot-list li {
  counter-increment: pin; display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 4px 12px;
  padding-block: 16px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; color: var(--muted);
}

/* scroll arrows */
.to-top {
  position: fixed; z-index: 10; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: grid; place-items: center; background: var(--surface); color: var(--muted); box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .3s ease, color .2s ease, transform .2s ease;
}
.to-top svg { width: 16px; height: 16px; }
.to-top:hover { color: var(--accent); transform: translateY(-2px); }
body.away .to-top { opacity: 1; pointer-events: auto; }
/* wide screens: line up with the side nav's right edge */
@media (min-width: 1400px) { .to-top { right: max(28px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); } }
@media (prefers-reduced-motion: reduce) { .to-top { transition: none; } }

/* white surfaces sit on a soft shadow instead of an outline */

.card:hover, .pager a:hover, .back:hover { border-color: transparent; box-shadow: var(--shadow-hover); }

.view { animation: in .35s ease both; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ================= editorial layer (v2) ================= */
.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.14em; }
/* a faint blue wash at the top of the page that settles into white */
body {
  font-size: 16px;
  background:
    radial-gradient(1100px 680px at 88% -140px, var(--glow), transparent 70%),
    radial-gradient(800px 520px at 0% 0%, var(--glow-2), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
}
/* project pages opened in their own view sit on plain white, so each project's own colour reads cleanly */
body.in-detail { background: var(--bg); }
::selection { background: var(--accent); color: var(--chip-ink); }

/* header: wordmark left, nav right, no rule; a soft ground only once the page has scrolled */
.top { padding-block: 0; background: transparent; transition: background .3s ease, box-shadow .3s ease; }
body.stuck .top { background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-bar { background: none; border: 0; border-radius: 0; padding-block: 22px; backdrop-filter: none; -webkit-backdrop-filter: none; }
.brand { gap: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.03em; }
.brand-mark { font-family: var(--font-display); font-size: 19px; letter-spacing: -.03em; text-transform: none; color: var(--accent); font-weight: 700; }
.nav { gap: 6px; }
.nav a { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--ink); border: 1px solid transparent; }
@media (hover: hover) { .nav a:hover { background: var(--bg); border-color: transparent; } }
.nav a.active { background: var(--ink); color: var(--bg); }
.side-nav { display: none !important; }
body.scrolled .top { opacity: 1; pointer-events: auto; transform: none; }

/* hero */
.hero { padding-block: clamp(36px, 6vw, 80px) 0; }
.hero-kicker { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 18px; border-bottom: 1px solid var(--ink); }
.hero-en {
  font-family: var(--font-display); font-weight: 300; font-size: clamp(40px, 7vw, 100px);
  line-height: .98; letter-spacing: -.045em; margin-top: clamp(28px, 4vw, 48px); max-width: 14ch; text-wrap: balance;
  font-variation-settings: "opsz" 96;
}
.hero-en em { font-style: normal; font-weight: 560; color: var(--accent); }
.hero-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; margin-top: clamp(36px, 5vw, 64px); }
.hero-row .hero-ko { min-width: 0; }
.hero-ko { font-size: clamp(17px, 1.8vw, 23px); line-height: 1.6; font-weight: 400; letter-spacing: -.01em; color: color-mix(in oklab, var(--ink) 72%, var(--bg)); }
.hero-ko b { font-weight: 600; color: inherit; }
/* keywords only: light glass chips with a small blue dot */
.hero-keys { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; }
.hero-keys + .hero-en { margin-top: clamp(18px, 2.4vw, 28px); }
.hero-row { margin-top: clamp(11px, 1.2vw, 17px) !important; }   /* the line sits close under the big word */
/* first screen: the statement holds the whole view and stays pinned; the rest of the page
   slides up over it as a sheet, while the statement fades back */
.hero {
  position: sticky; top: 0; z-index: 0;
  min-height: calc(100svh - var(--top-h, 72px)); padding-block: 0 clamp(96px, 16vh, 180px);
  display: flex; flex-direction: column; justify-content: center;
}
.hero > :not(.hero-cue) {
  opacity: calc(1 - var(--hp, 0) * .9);
  transform: translate3d(0, calc(var(--hp, 0) * -32px), 0);
  will-change: opacity, transform;
}
.hero .hero-en { font-size: clamp(60px, 10.5vw, 150px); }
/* the one word on the first screen: a plain bold sans (Inter, the Latin of Pretendard) */
.hero-en .hero-word { display: inline-block; font-family: "Inter", var(--font-body); font-weight: 700; font-variation-settings: normal; letter-spacing: -.035em; color: var(--accent); }
/* hand kerning: at this weight r–t and t–f touch, so the t and f get a little air */
.hero-word .kt { margin-left: .06em; } .hero-word .kf { margin-left: .07em; }
.hero .hero-ko { font-size: clamp(17px, 1.8vw, 24px); }
/* scroll cue: a hairline track with an accent bead travelling down it */
.hero-cue {
  position: absolute; left: 50%; bottom: 32px; translate: -50% 0;
  display: grid; justify-items: center; gap: 14px;
  font-family: var(--font-display); font-size: 10.5px; font-weight: 500; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase;
  color: var(--muted); text-decoration: none; opacity: calc(1 - var(--hp, 0) * 5);
  transition: color .2s ease;
}
.hero-cue:hover { color: var(--ink); }
.hero-cue i { position: relative; width: 1px; height: 52px; background: var(--line); overflow: hidden; }
.hero-cue i::after { content: ""; position: absolute; left: 0; top: 0; width: 1px; height: 18px; background: var(--accent); animation: cue 2.2s cubic-bezier(.65, 0, .35, 1) infinite; }
@keyframes cue { 0% { transform: translateY(-18px); } 70%, 100% { transform: translateY(52px); } }
@media (prefers-reduced-motion: reduce) { .hero-cue i::after { animation: none; transform: translateY(17px); } }
/* first visit: the word and the line are there almost at once (a short fade), then the keyword pill
   opens from its dot to the right as the one accent. Only inner elements move, so the scroll-linked
   fade on the hero's children stays untouched. */
.hero-intro .hero-word, .hero-intro .hero-ko { animation: hero-fade .45s ease backwards; }
.hero-intro .hero-keys li { animation: pill-shell .3s ease .85s backwards, pill-open .75s cubic-bezier(.65, 0, .35, 1) .85s backwards, pill-text .45s ease 1.1s backwards; }
.hero-intro .hero-keys li::before { animation: pill-dot .4s cubic-bezier(.2, .8, .2, 1.3) .45s backwards; }
@keyframes hero-fade { from { opacity: 0; } }
@keyframes pill-dot { from { opacity: 0; transform: scale(.2); } }
@keyframes pill-shell { from { border-color: transparent; background-color: transparent; } }
@keyframes pill-open { from { clip-path: inset(0 calc(100% - 2.5em) 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }
@keyframes pill-text { from { color: transparent; } }
@media (prefers-reduced-motion: reduce) { .hero-intro .hero-keys li, .hero-intro .hero-keys li::before, .hero-intro .hero-word, .hero-intro .hero-ko { animation: none; } }
/* the page rises over the statement with a soft gradient edge instead of a hard card edge */
.sheet { position: relative; z-index: 1; background: var(--bg); }
.sheet::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 38vh; pointer-events: none;
  opacity: min(1, calc(var(--hp, 0) * 6));
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 0%, transparent), color-mix(in srgb, var(--bg) 70%, transparent) 55%, var(--bg));
}
.sheet > .section:first-child { padding-top: clamp(48px, 6vw, 80px); }

/* work index: three wide pieces, then a two-up grid */
.work-index { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(40px, 5vw, 64px) clamp(16px, 2.4vw, 32px); }

// bracketed text is a placeholder the designer still has to write
const phText = s => /^\[.*\]$/.test(s) ? `<p class="ph">${esc(s.slice(1, -1))}</p>` : `<p>${esc(s)}</p>`;

const ovVal = (p, key) => ((p.overview || []).find(([k]) => k === key) || [])[1] || '';
const phInline = s => /^\[.*\]$/.test(s) ? `<span class="ph-inline">✎ ${esc(s.slice(1, -1))}</span>` : esc(s);

function overviewHtml(rows) {
  return `<section class="d-sec d-overview"><div class="d-sec-head"><span class="eyebrow">Overview</span>${draftTag}</div>
    <dl class="ov-list">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${phText(v)}</dd></div>`).join('')}</dl>
  </section>`;
}

// 3×3 construction grid drawn in the symbol image's own pixel space.
// Lines were measured from gsi_symbol.png (266×262): mark bounds x 6–264, y 3–261;
// the inner square runs x 92–178, y 90–174, so the module lines sit on its edges.
const grid9Svg = (() => {
  const xs = [6, 91.5, 178.5, 264], ys = [3, 89.5, 174.5, 261];
  const dots = xs.flatMap(x => ys.map(y => `<circle cx="${x}" cy="${y}" r="3.5"/>`)).join('');
  return `<svg class="grid9" viewBox="0 0 266 262" preserveAspectRatio="none" aria-hidden="true">
    <rect x="${xs[0]}" y="${ys[0]}" width="${xs[3] - xs[0]}" height="${ys[3] - ys[0]}" class="g-frame"/>
    <path d="M${xs[1]} ${ys[0]}V${ys[3]}M${xs[2]} ${ys[0]}V${ys[3]}M${xs[0]} ${ys[1]}H${xs[3]}M${xs[0]} ${ys[2]}H${xs[3]}" class="g-line"/>
    <g class="g-dot">${dots}</g></svg>`;
})();

function itemHtml(it) {
  switch (it.type) {
    case 'image':
      return `<figure class="sec-img${it.free ? ' free' : ''}"><img src="${it.src}" alt="${esc(it.alt || '')}" loading="lazy"></figure>`;
    case 'slot':
      return `<div class="slot" style="aspect-ratio:${it.ratio}">
        <span class="draft">교체 필요</span><strong>${esc(it.label)}</strong><p>${esc(it.note)}</p><small>권장 크기 ${esc(it.size)}</small>
      </div>`;
    case 'annotate':
      return `<div class="panel annot">
        <div class="annot-fig"><div class="annot-img"><img src="${it.src}" alt="forin 로고">
          <svg class="pin-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${it.pins.filter(p => p[4] != null).map(([x, y, , , tx, ty]) => `<line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}"/>`).join('')}</svg>
          ${it.pins.map(([x, y, , , tx, ty], i) => `${tx != null ? `<span class="pin-dot" style="left:${tx}%;top:${ty}%"></span>` : ''}<span class="pin" style="left:${x}%;top:${y}%">${i + 1}</span>`).join('')}</div></div>
        <ol class="annot-list">${it.pins.map(([, , k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('')}</ol>
        ${it.final ? '' : `<p class="annot-note">${draftTag} 표시 위치와 설명은 추정입니다. 실제 작업 의도에 맞게 고쳐 주세요.</p>`}
      </div>`;
    case 'pair':
      return `<div class="pair">${it.srcs.map(([src, cap]) => `<div class="pair-item">
        <figure class="sec-img free"><img src="${src}" alt="${esc(cap)}" loading="lazy"></figure>${it.nocap ? '' : `<span class="cap">${esc(cap)}</span>`}</div>`).join('')}</div>`;
    case 'grid':
      return `<div class="panel gridbox">
        <div class="gb-step"><div class="gb-fig" style="background:${it.bg}"><img src="${it.from}" alt="G S I 글자"></div><small>G · S · I</small></div>
        <span class="gb-arrow" aria-hidden="true">→</span>
        <div class="gb-step"><div class="gb-fig" style="background:${it.bg}"><div class="gb-sym"><img src="${it.to}" alt="GSI 심볼">${grid9Svg}</div></div><small>9분할 그리드 위의 심볼</small></div>
        ${it.final ? '' : `<p class="annot-note">${draftTag} 그리드 선은 설명을 위해 그린 것입니다. 실제 작업한 그리드 이미지로 교체해 주세요.</p>`}
      </div>`;
    case 'steps':
      return `<div class="panel steps"><ol>${it.steps.map((s, i) => `<li><span>STEP ${i + 1}</span><b>${esc(s)}</b></li>`).join('')}</ol>
        <p class="annot-note">${draftTag} ${esc(it.note)}</p></div>`;
    case 'season': {
      // Main mark large on the left, its variants on the right, colours as small chips under each mark.
      // Marks are sized by optical area (not width) inside their box; boxH = box height / box width.
      const fit = (dims, area, max, boxH = 1, scale = 1) => {
        const ar = dims[0] / dims[1];
        let w = Math.sqrt(area * boxH * ar) * scale;
        w = Math.min(w, max, max * boxH * ar);
        return `width:${(w * 100).toFixed(1)}%`;
      };
      const chips = cs => `<div class="sn-chips">${cs.map(([h, role, code]) => `<span class="sn-chip" title="${esc(role)}"><i style="background:${h}"></i><code>${esc(code || h)}</code></span>`).join('')}</div>`;
      const [ms, ml, md, mc, mbg] = it.main;
      const tint = bg => bg ? ` tinted" style="background:${bg}` : '';   // optional colour block behind a mark
      const [mainLabel, varLabel] = it.labels || ['Main', 'Season'];
      const wide = it.cols === 1;                       // one column of wide boxes (lockups, line versions)
      const vBoxH = wide ? 0.32 : 1, mBoxH = wide ? 0.6 : 1;   // wide: shorter boxes so two variants don't leave the panel half empty
      return `<div class="panel season${wide ? ' wide' : ''}">
        <div class="sn-main">
          <span class="eyebrow">${esc(mainLabel)}</span>
          <div class="sn-box sn-box-main${tint(mbg)}"><img src="${ms}" alt="${esc(ml)} 로고" style="${fit(md, it.mainArea || 0.5, 0.82, mBoxH)}"></div>
          <b>${esc(ml)}</b>${chips(mc)}
        </div>
        <div class="sn-vars">
          <span class="eyebrow">${esc(varLabel)}</span>
          <div class="sn-grid${wide ? ' c1' : ''}">${it.variants.map(([s, l, d, c, scale, bg]) => `<figure class="sn-var">
            <div class="sn-box${tint(bg)}"><img src="${s}" alt="${esc(l)} 로고" style="${fit(d, wide ? (bg ? 0.24 : 0.36) : 0.42, 0.86, vBoxH, scale)}"></div>
            <figcaption><b>${esc(l)}</b>${chips(c)}</figcaption></figure>`).join('')}</div>
        </div>
      </div>`;
    }
    case 'logos': {
      // Size each mark by optical area rather than width, so wide, tall and square logos read as equally weighted.
      const many = it.variants.length > 4;
      const tileH = many ? 1 : 0.75;            // tile height as a fraction of its width
      const area = many ? 0.26 : 0.12;          // share of the tile each mark should cover
      const maxW = 0.82, maxH = many ? 0.62 : 0.6;
      const size = dims => {
        if (!dims) return '';
        const ar = dims[0] / dims[1];
        let w = Math.sqrt(area * tileH * ar);
        w = Math.min(w, maxW, maxH * tileH * ar);
        return ` style="width:${(w * 100).toFixed(1)}%"`;
      };
      return `<div class="logo-grid sized${many ? ' many' : ''}" style="grid-template-columns:repeat(${it.cols || it.variants.length}, minmax(0, 1fr))">${it.variants.map(([src, bg, label, dims]) => `<figure class="logo-tile" style="background:${bg}">
        <img src="${src}" alt="로고 ${esc(label)}"${size(dims)}><figcaption>${esc(label)}</figcaption></figure>`).join('')}</div>`;
    }
    case 'palette':
      return `<div class="panel palette">
        <div class="swatches" style="grid-template-columns:repeat(${it.colors.length}, minmax(0, 1fr))">${it.colors.map(([n, h, r, code]) => `<div class="swatch"><i style="background:${h}"></i><b>${esc(n)}</b><code>${esc(code || h)}</code><small>${esc(r)}</small></div>`).join('')}</div>
        ${it.note ? `<p class="annot-note">${draftTag} ${esc(it.note)}</p>` : ''}
      </div>`;
    case 'type':
      return `<div class="type-grid">${it.faces.map(([n, w, role, sample, kind]) => `<div class="panel type-card">
        <span class="type-sample ${kind}">${esc(sample)}</span>
        <b>${esc(n)}</b><small>${esc(w)}</small><p>${esc(role)}</p></div>`).join('')}</div>`;
  }
  return '';
}

function sectionHtml(s) {
  return `<section class="d-sec">
    <div class="d-sec-head"><span class="eyebrow">${esc(s.eyebrow)}</span>${s.final ? '' : draftTag}<h2>${esc(s.title)}</h2>${s.note ? `<p>${esc(s.note)}</p>` : ''}</div>
    <div class="d-sec-body">${s.items.map(itemHtml).join('')}</div>
  </section>`;
}

function detailView(p) {
  // "Other projects" only cycles through work that has its own page; pop-up work stays in the pop-up.
  const pages = WORK_INDEX.filter(k => k.project).map(k => PROJECTS.find(x => x.id === k.project)).filter(x => !x.slides && !x.hidden);   // same order as the list
  const i = pages.indexOf(p);
  const prev = pages[(i - 1 + pages.length) % pages.length];
  const next = pages[(i + 1) % pages.length];
  const f = fieldOf(p.field);
  const kw = p.keywords ? `<section class="d-kw"><span class="eyebrow">Keyword</span>
      ${p.keywords.map(g => `<div class="kw-group">${g.label ? `<h5>${esc(g.label)}</h5>` : ''}<div class="kw-list">
        ${g.items.map(([k, v]) => `<div class="kw-item"><b>${esc(k)}</b>${esc(v)}</div>`).join('')}
      </div></div>`).join('')}
    </section>` : '';
  const more = (q, dir) => `<a class="more-card ${dir}" href="#${q.id}">
      <div class="more-thumb"><img src="${q.cover || img(q.thumb)}" alt="" loading="lazy" style="object-position:${q.coverPos || '50% 50%'}"></div>
      <div class="more-text"><span class="eyebrow">${dir === 'prev' ? `${ICON.back} 이전 프로젝트` : `다음 프로젝트 ${ICON.go}`}</span><strong>${esc(q.title)}</strong><small>${esc(q.sub)}</small></div>
    </a>`;
  // A text-free cover (when supplied) sits as a low banner under the intro so both fit on one screen;
  // otherwise the first PDF page leads, full size, above the intro.
  const cover = p.cover
    ? `<figure class="d-banner"><img src="${p.cover}" alt="${esc(p.title)} 대표 이미지" style="object-position:${p.coverPos || '50% 50%'}"></figure>`
    : `<figure class="d-cover"><img src="${img(p.pages[0])}" alt="${esc(p.title)} 대표 이미지"></figure>`;
  return `<div class="view"><section class="detail wrap tinted${p.cover ? ' has-banner' : ''}" style="--pa:${p.color[0]};--pa-d:${p.color[1]}">
    <a class="back" href="#work" data-home><span class="arr">${ICON.back}</span>목록으로</a>
    ${p.cover ? '' : cover}
    <header class="d-intro">
      <span class="eyebrow">${f.en}</span>
      <h1>${esc(p.title)}</h1>
      <p class="sub">${esc(p.sub)}</p>
      <div class="desc">${p.desc.map(d => `<p>${esc(d)}</p>`).join('')}</div>
    </header>
    ${p.cover ? cover : ''}
    <dl class="d-facts">
      <div><dt>분야</dt><dd>${f.ko}</dd></div>
      <div><dt>유형</dt><dd>${esc(KIND[p.id] || '')}</dd></div>
      <div><dt>연도</dt><dd>${phInline(ovVal(p, '연도') || '[예: 2024]')}</dd></div>
      <div><dt>기여도</dt><dd>${p.share}</dd></div>
      <div><dt>Tool</dt><dd>${tools(p.tools)}</dd></div>
    </dl>
    ${ovVal(p, '목표') ? `<p class="d-goal"><b>목표</b><span>${phInline(ovVal(p, '목표'))}</span></p>` : ''}
    ${kw}
    ${p.sections ? p.sections.map(sectionHtml).join('') : `<div class="pages">
      ${p.pages.slice(1).map((n, k) => `<figure><img src="${img(n)}" alt="${esc(p.title)} 작업 이미지 ${k + 2}" loading="lazy"></figure>`).join('')}
    </div>`}
    ${p.retro ? `<section class="d-sec d-retro"><div class="d-sec-head"><span class="eyebrow">Retrospective</span>${/^\[/.test(p.retro) ? draftTag : ''}<h2>돌아보며</h2></div><div class="panel">${phText(p.retro)}</div></section>` : ''}
    <section class="d-more" aria-label="다른 프로젝트">
      <span class="eyebrow">다른 프로젝트</span>
      <div class="d-more-grid">${more(prev, 'prev')}${more(next, 'next')}</div>
    </section>
  </section></div>`;
}

const app = document.getElementById('app');
let mode = null;

// Scroll to a home section by measuring it, so the pinned statement (#top) and the sticky header can't throw it off.
function scrollToSection(el, smooth) {
  const top = el.id === 'top' ? 0 : el.getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(el).scrollMarginTop) || 0);
  window.scrollTo({ top, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' });
}

// Where the work list was scrolled when a project page opened, so "목록으로" and the browser back button
// bring the list back to the same spot instead of the top of the Work section.
let homeScroll = null;
function route(h = location.hash.slice(1), smooth = false, restore = false) {
  const p = PROJECTS.find(x => x.id === h);
  document.body.classList.toggle('in-detail', !!p);
  if (p) {
    if (mode === 'home') homeScroll = window.scrollY;
    app.innerHTML = detailView(p); mode = p.id;
    window.scrollTo(0, 0);
    reveal(app.querySelectorAll('.d-facts, .d-kw, .d-sec, .pages figure, .d-more'));
    document.title = p.title + ' · 조희수 포트폴리오';
    return;
  }
  document.title = '조희수 포트폴리오';
  if (mode !== 'home') {
    app.innerHTML = homeView(); mode = 'home'; smooth = false;
    if (restore && homeScroll != null) {
      // the list cards have fixed aspect ratios, so the page is already its final height here
      window.scrollTo(0, homeScroll);
      reveal(app.querySelectorAll('.section:not(#work), .work-index .wi'));
      return;
    }
    window.scrollTo(0, 0);
    reveal(app.querySelectorAll('.section:not(#work), .work-index .wi'));
  }
  const target = h && document.getElementById(h);
  if (target) scrollToSection(target, smooth); else if (!h) window.scrollTo(0, 0);
}

// Slide each big block up as it scrolls into view. Blocks already on screen at load stay put.
const motionOK = 'IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = motionOK ? new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' }) : null;
function reveal(els) {
  if (!io) return;
  els.forEach(el => {
    if (el.getBoundingClientRect().top > window.innerHeight * 0.92) { el.classList.add('reveal'); io.observe(el); }
  });
}

// Highlight the section in view and swap the top bar for the side nav once the hero is gone.
const SECS = [['work', 'work'], ['about', 'about'], ['career', 'career']];
let navLock = '';
['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(t => window.addEventListener(t, ev => {
  if (navLock && !(t === 'mousedown' && ev.target.closest('[data-sec]'))) { navLock = ''; queueNav(); }
}, { passive: true }));
function updateNav() {
  const hero = mode === 'home' && document.getElementById('top');
  // the pinned statement fades as the sheet rises over it
  // (set on the two elements that use it, and only when it changes, so scrolling doesn't restyle the whole page)
  if (hero) {
    const hp = Math.min(1, Math.max(0, window.scrollY / hero.offsetHeight)).toFixed(3);
    if (hero.style.getPropertyValue('--hp') !== hp) {
      hero.style.setProperty('--hp', hp);
      document.querySelector('.sheet').style.setProperty('--hp', hp);
    }
  }
  document.body.classList.toggle('scrolled', !!hero && hero.getBoundingClientRect().bottom < 80);
  document.body.classList.toggle('away', window.scrollY > 480);
  document.body.classList.toggle('stuck', window.scrollY > 8);
  const pageBack = mode !== 'home' && document.querySelector('.detail .back');
  // on phones the page drops its own back button, so the header one waits for the first scroll instead
  const backGone = pageBack && (pageBack.offsetParent ? pageBack.getBoundingClientRect().bottom < 80 : window.scrollY > 120);
  document.body.classList.toggle('back-gone', !!backGone);
  // curId picks the blue section title; cur picks the nav item (Education & Skills sits under Experience)
  let cur = '', curId = '';
  if (mode === 'home') {
    [...SECS, ['contact', 'contact']].forEach(([id, key]) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= window.innerHeight * 0.45) { cur = key; curId = id; } });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 24) cur = curId = 'contact';
    // a menu click wins until the reader scrolls by hand: on a tall screen the page may not be able to move
    // far enough for the clicked section (Contact above all) to reach the line on its own
    if (navLock) cur = curId = navLock;
  }
  document.querySelectorAll('[data-sec]').forEach(a => a.classList.toggle('active', a.dataset.sec === cur));
  [...SECS.map(([id]) => id), 'contact'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('is-current', id === curId); });
}
// one update per frame keeps the fade in step with the scroll
let navFrame = 0;
const queueNav = () => { if (!navFrame) navFrame = requestAnimationFrame(() => { navFrame = 0; updateNav(); }); };
const syncTopH = () => document.documentElement.style.setProperty('--top-h', document.querySelector('.top').offsetHeight + 'px');
window.addEventListener('scroll', queueNav, { passive: true });
window.addEventListener('resize', () => { syncTopH(); queueNav(); });
syncTopH();

// ---- pop-up viewer: detail pages scroll down inside it, banner/content sets slide sideways ----
const dpModal = document.getElementById('dp-modal');
const dpPanel = dpModal.querySelector('.dp-panel');
const dpScroll = document.getElementById('dp-scroll');
const dpInfo = document.getElementById('dp-info');
let dpIndex = -1, dpOpener = null, viewMode = null, galProject = null, galIndex = 0;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function galRender(p) {
  // Same frame as the detail-page viewer: images stacked top to bottom on the left, info fixed on the right.
  galProject = p;
  const f = fieldOf(p.field);
  dpPanel.classList.remove('is-gal', 'info-open');
  dpPanel.classList.add('tinted');
  dpPanel.classList.toggle('is-cards', p.field === 'cardnews');
  dpPanel.style.setProperty('--pa', p.color[0]); dpPanel.style.setProperty('--pa-d', p.color[1]);
  const tag = t => t ? `<span class="stack-tag">${esc(t)}</span>` : '';
  dpScroll.innerHTML = `<div class="stack">${p.slides.map(([src, cap, w, t], i) => Array.isArray(src)
    // a nested list is a row: its images sit side by side, as many columns as images
    ? `<figure class="stack-item stack-row" style="--n:${src.length}${w ? `;max-width:${w}px` : ''}">${tag(t)}${src.map(([s, c, cap]) => cap
      ? `<span class="stack-cell"><img src="${s}" alt="${esc(p.title)} · ${esc(c)}" loading="lazy"><small class="stack-cap"><b><i style="background:${cap[1]}"></i>${esc(cap[0])}</b>${cap[2] ? `<span>${esc(cap[2])}</span>` : ''}</small></span>`
      : `<img src="${s}" alt="${esc(p.title)} · ${esc(c)}" loading="lazy">`).join('')}</figure>`
    : `<figure class="stack-item">${tag(t)}
    <img src="${src}" alt="${esc(p.title)} · ${esc(cap)}" ${w ? `style="max-width:min(${w}px, 100%)"` : ''} ${i > 1 ? 'loading="lazy"' : ''}></figure>`).join('')}</div>`;   // caption lives in alt only; the images speak for themselves
  const kw = p.keywords ? `<div class="gal-kw">${p.keywords.map(g => `${g.label ? `<h5>${esc(g.label)}</h5>` : ''}<ul>${g.items.map(([k, v]) => `<li><b>${esc(k)}</b>${esc(v)}</li>`).join('')}</ul>`).join('')}</div>` : '';
  const stepsItem = p.sections && p.sections.flatMap(s => s.items).find(it => it.type === 'steps');
  const steps = stepsItem ? `<ol class="gal-steps">${stepsItem.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '';
  dpInfo.innerHTML = `<span class="eyebrow">${f.en}</span>
    <h3 id="dp-title">${esc(p.title)}</h3>
    <p class="dp-brand">${esc(p.sub)}</p>
    <dl class="dp-meta">
      <div><dt>유형</dt><dd>${esc(KIND[p.id] || '')}</dd></div>
      ${ovVal(p, '기간') && !/^\[/.test(ovVal(p, '기간')) ? `<div><dt>기간</dt><dd>${esc(ovVal(p, '기간'))}</dd></div>` : ''}
      <div><dt>기여도</dt><dd>${esc(p.share)}</dd></div>
      <div><dt>Tool</dt><dd>${tools(p.tools)}</dd></div>
    </dl>
    <div class="gal-desc">${p.desc.map(d => `<p>${esc(d)}</p>`).join('')}</div>
    ${p.credit ? `<p class="gal-credit">※ ${esc(p.credit)}</p>` : ''}
    ${steps}${kw}`;
  dpScroll.scrollTop = 0; dpInfo.scrollTop = 0; dpPanel.scrollTop = 0;
}
// ‹ › in the viewer move between the banner & content projects (hidden ones stay out, as in the list)
const galList = () => WORK_INDEX.filter(k => k.project).map(k => PROJECTS.find(x => x.id === k.project)).filter(x => x.slides && !x.hidden);   // same order as the list
function galStep(d) {
  const list = galList(), i = list.indexOf(galProject);
  galRender(list[(i + d + list.length) % list.length]);
}

// '_' joins words that should wrap together; a bracket stays on the word it is attached to
const nb = s => String(s).replace(/_/g, '\u00a0').replace(/([가-힣A-Za-z0-9])\(/g, '$1\u2060(');
function dpRender(i) {
  dpPanel.classList.remove('is-gal', 'tinted', 'info-open', 'is-cards');
  const d = DETAIL_PAGES[i];
  dpScroll.innerHTML = d.long
    ? `<div class="dp-sheet"><div class="dp-sheet-in">${[].concat(d.long).map((src, k) => `<img src="${src}" alt="${esc(nb(d.title))} 상세페이지 ${k + 1}" ${k > 1 ? 'loading="lazy"' : ''}>`).join('')}</div></div>`
    : `<div class="dp-long-slot"><span class="draft">교체 필요</span><strong>상세페이지 전체 이미지</strong><p>가로 860px 기준, 세로 길이는 제한 없이 한 장으로 넣어 주세요.</p><small>아래로 스크롤하며 보는 영역입니다</small></div>`;
  dpInfo.innerHTML = `<span class="eyebrow">Detail Page · ${String(i + 1).padStart(2, '0')} / ${String(DETAIL_PAGES.length).padStart(2, '0')}</span>
    <h3 id="dp-title">${esc(nb(d.title))}</h3>
    <p class="dp-brand">${esc(nb(d.brand))}</p>
    <dl class="dp-meta">
      <div><dt>유형</dt><dd>${esc(d.kind || '실무 프로젝트')}</dd></div>
      <div><dt>기간</dt><dd>${esc(d.period)}</dd></div>
      <div><dt>기여도</dt><dd>${esc(d.share)}</dd></div>
      <div><dt>Tool</dt><dd>${tools(d.tools)}</dd></div>
    </dl>
    ${phText(nb(d.desc))}
    ${d.credit ? `<p class="gal-credit">※ ${esc(nb(d.credit))}</p>` : ''}`;
  dpInfo.querySelectorAll('h3, .dp-brand, dd').forEach(el => { if (/^\[.*\]$/.test(el.textContent)) el.classList.add('ph-inline'); });
  dpScroll.scrollTop = 0; dpInfo.scrollTop = 0;
  dpModal.querySelector('.dp-panel').scrollTop = 0;
  dpIndex = i;
}
function modalShow(opener) {
  dpOpener = opener || null;
  dpModal.hidden = false;
  // a hidden element ignores scrollTop, so the reset in the render step only takes once it is shown again:
  // every opening starts at the top instead of where the last visit left off
  dpScroll.scrollTop = 0; dpInfo.scrollTop = 0; dpPanel.scrollTop = 0;
  document.documentElement.classList.add('dp-lock');
  requestAnimationFrame(() => dpModal.classList.add('open'));
  dpModal.querySelector('.dp-close').focus();
}
function dpOpen(i, opener) { viewMode = 'dp'; dpRender(i); modalShow(opener); }
function galOpen(id, opener) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;
  viewMode = 'gal'; galRender(p); modalShow(opener);
}
function dpClose() {
  dpScroll.scrollTop = 0; dpInfo.scrollTop = 0; dpPanel.scrollTop = 0;
  dpModal.classList.remove('open');
  dpPanel.classList.remove('info-open');
  dpModal.hidden = true;
  document.documentElement.classList.remove('dp-lock');
  if (dpOpener) dpOpener.focus();
  dpIndex = -1; viewMode = null;
}
document.addEventListener('click', e => {
  const dpBtn = e.target.closest('[data-dp]');
  if (dpBtn) { dpOpen(+dpBtn.dataset.dp, dpBtn); return; }
  const galBtn = e.target.closest('[data-gal]');
  if (galBtn) { galOpen(galBtn.dataset.gal, galBtn); return; }
  if (!viewMode) return;
  if (e.target.closest('[data-dp-close]')) { dpClose(); return; }
  const step = e.target.closest('[data-dp-step]');
  if (step && viewMode === 'dp') dpRender((dpIndex + +step.dataset.dpStep + DETAIL_PAGES.length) % DETAIL_PAGES.length);
  if (step && viewMode === 'gal') galStep(+step.dataset.dpStep);
});
document.addEventListener('keydown', e => {
  if (!viewMode) return;
  if (e.key === 'Escape') dpClose();
  if (viewMode === 'gal') {
    if (e.key === 'ArrowRight') galStep(1);
    if (e.key === 'ArrowLeft') galStep(-1);
    return;
  }
  if (e.key === 'ArrowRight') dpRender((dpIndex + 1) % DETAIL_PAGES.length);
  if (e.key === 'ArrowLeft') dpRender((dpIndex - 1 + DETAIL_PAGES.length) % DETAIL_PAGES.length);
});

// Arrow buttons: jump to the very top or bottom of the page.
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  window.scrollTo({ top: b.dataset.go === 'top' ? 0 : document.documentElement.scrollHeight, behavior });
});

// In-page links navigate here instead of through the URL hash: the artifact viewer doesn't reliably let a page
// change its own hash, so menu clicks could do nothing. The hash is still updated when allowed, for the back button.
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  navLock = a.dataset.sec || '';
  try { if (location.hash.slice(1) !== id) history.pushState(null, '', '#' + id); } catch (_) {}
  route(id, mode === 'home', a.matches('.back, .top-back'));
  updateNav();
});

window.addEventListener('popstate', () => { route(undefined, false, true); updateNav(); });
// Always open on the first screen: the browser would otherwise restore the last scroll position on reload,
// and a leftover section anchor (#work, #about …) would jump past the statement. Project links still open directly.
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
try { if (location.hash === '#ssukgukdang') history.replaceState(null, '', '#ssookookdang'); } catch (_) {}   // old address
try { if (!PROJECTS.some(x => x.id === location.hash.slice(1))) history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
// the opening plays on the first load only, not when coming back to the list from a project page.
// (its own class name: .intro is already a content block style elsewhere on the page)
document.documentElement.classList.add('hero-intro');
setTimeout(() => document.documentElement.classList.remove('hero-intro'), 2600);
route();
window.scrollTo(0, 0);
// Some browsers still put an embedded page back where it was on reload, at some point while it loads.
// Until a moment after load, a scroll the reader didn't make is undone right in the scroll event,
// which runs before that frame is painted, so the old position never shows.
let touchedEarly = false;
['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(t => window.addEventListener(t, () => { touchedEarly = true; }, { once: true, passive: true }));
const holdTop = () => { if (!touchedEarly && mode === 'home' && window.scrollY) window.scrollTo(0, 0); };
window.addEventListener('scroll', holdTop, { passive: true });
window.addEventListener('load', () => { holdTop(); setTimeout(() => { holdTop(); window.removeEventListener('scroll', holdTop); }, 1500); });
updateNav();
reveal([document.getElementById('contact')]);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const done = () => { b.textContent = '복사됨'; setTimeout(() => (b.textContent = '복사'), 1600); };
  const fallback = () => {
    const v = b.previousElementSibling; const r = document.createRange(); r.selectNodeContents(v);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '선택됨 · Ctrl+C';
    setTimeout(() => (b.textContent = '복사'), 2400);
  };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (_) { fallback(); }
});
</script>
